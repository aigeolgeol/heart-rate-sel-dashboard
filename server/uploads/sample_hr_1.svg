<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" style="background:#0f172a; font-family:sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="600" height="60" fill="#1e293b"/>
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="bold">미밴드 8 - 오늘의 심박수 기록</text>
  <text x="480" y="38" fill="#94a3b8" font-size="14">2026.10.14</text>
  
  <!-- Stats Card -->
  <rect x="30" y="80" width="160" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="45" y="110" fill="#94a3b8" font-size="13">최고 심박수</text>
  <text x="45" y="145" fill="#f43f5e" font-size="28" font-weight="bold">188 <tspan font-size="16">bpm</tspan></text>
  
  <rect x="220" y="80" width="160" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="235" y="110" fill="#94a3b8" font-size="13">평균 심박수</text>
  <text x="235" y="145" fill="#38bdf8" font-size="28" font-weight="bold">124 <tspan font-size="16">bpm</tspan></text>

  <rect x="410" y="80" width="160" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="425" y="110" fill="#94a3b8" font-size="13">안정 심박수</text>
  <text x="425" y="145" fill="#4ade80" font-size="28" font-weight="bold">68 <tspan font-size="16">bpm</tspan></text>

  <!-- Heart Rate Graph -->
  <rect x="30" y="180" width="540" height="190" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="210" fill="#cbd5e1" font-size="15" font-weight="bold">시간별 심박수 추이 (09:00 ~ 14:00)</text>
  
  <!-- Grid lines -->
  <line x1="50" y1="240" x2="550" y2="240" stroke="#334155" stroke-dasharray="4"/>
  <text x="525" y="235" fill="#64748b" font-size="10">180 bpm</text>
  
  <line x1="50" y1="280" x2="550" y2="280" stroke="#334155" stroke-dasharray="4"/>
  <text x="525" y="275" fill="#64748b" font-size="10">120 bpm</text>
  
  <line x1="50" y1="320" x2="550" y2="320" stroke="#334155" stroke-dasharray="4"/>
  <text x="525" y="315" fill="#64748b" font-size="10">60 bpm</text>

  <!-- Graph Line & Gradient Area -->
  <defs>
    <linearGradient id="hrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <path d="M 60 320 Q 120 310 160 270 T 260 235 T 320 300 T 400 240 T 480 310 L 540 320 L 540 340 L 60 340 Z" fill="url(#hrGrad)"/>
  <path d="M 60 320 Q 120 310 160 270 T 260 235 T 320 300 T 400 240 T 480 310 L 540 320" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Peak point highlight -->
  <circle cx="260" cy="235" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
  <rect x="220" y="200" width="80" height="24" rx="4" fill="#f43f5e"/>
  <text x="260" y="216" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">188 bpm (체육)</text>
</svg>
